palette = "noctalia"

# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $cmd_duration$username$hostname $directory $git_branch
# $character
# """
format = """
 $os$username 󰜥 $directory $git_branch $package$nodejs$python$golang$rust$bun$lua$cmake$buf$c$cpp$cobol$conda$crystal$dart$deno$direnv$dotnet$elixir$elm$erlang$fennel$fortran$gleam$gradle$haskell$haxe$java$julia$kotlin$maven$meson$mojo$nim$ocaml$odin$perl$php$pixi$pulumi$purescript$raku$red$rlang$ruby$scala$solidity$spack$swift$vlang$typst$vagrant$xmake$zig$aws$azure$docker_context$gcloud$guix_shell$helm$kubernetes$nix_shell$openstack$terraform
$character"""

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[   ](bold fg:blue)"
error_symbol = "[   ](bold fg:red)"

# Disable the package module, hiding it from the prompt completely
